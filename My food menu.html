<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Food Menu</title>
<style>
  body {
    font-family: cursive;
    background: #fff8f0;
    padding: 30px;
    text-align: center;
  }

   h1 {
    color: red;
   }


h1 + p {
    background: #ffe0b2;
    padding: 10px 20px;
    border-radius: 8px;
    color: brown;
    display: inline-block;
}

ul {
     padding: 0;
     margin-top: 20px;
}


ul > li {
   list-style: none;
   font-size: 18px;
   font-weight: bold;
   color: black;
   padding: 10px 20px;
   margin: 6px auto;
   width: 260px;
   background: beige;
   border-radius: 8px;
}


li:nth-child(3) {
  background: red;
  color: orange;
}

a {
   color: red;
   text-decoration: none ;
   font-size: 15px;
   margin: 0 12px;
   padding: 8px 18px;
   border: 2px solid red;
   border-radius: 8px;
}

a:hover {
   background: black;
   color: white;
   font-size: 27px;
}

.desc {
   color: black;
   margin-top: 20px;
   font-size: 15px;
   max-width: 400px;
   margin-left: auto;
   margin-right: auto;
   color: brown;
   font-weight: bold;
 } 


.desc::first-letter {
   font-size: 200%;
   color: brown;
   font-weight: bold;
}

 .links {
   margin-top: 25px;
   }
</style>
</head>
<body>
 <h1>My Food Menu</h1>

<p>Pick your favourite dish and dig in!</p>

<ul>

<li>Pizza</li>

<li>Burger</li>

<li>Tacos — Chef's Special!</li>

<li>Noodles</li>

<li>Ice Cream</li>

</ul>

<p class="desc">Every dish on this menu is made with love and

loads of flavour. Try them all and find your favourite!</p>

<div class="links">

<a href="#">Order Now</a>

<a href="#">See More</a>

</div>     
</body>
</html>
